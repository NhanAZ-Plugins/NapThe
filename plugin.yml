---
name: NapThe
version: 1.0.0
main: NapThe\NapThe
src-namespace-prefix: NapThe
api: 5.0.0
author: NhanAZ
description: "Plugin nạp thẻ cho máy chủ PocketMine-MP sử dụng API của trumthe.vn"
website: https://github.com/NhanAZ/NapThe

commands:
  napthe:
    description: "Mở giao diện nạp thẻ"
    usage: "Sử dụng: /napthe"
    permission: napthe.command.napthe
  topnapthe:
    description: "Xem bảng xếp hạng những người nạp thẻ nhiều nhất"
    usage: "Sử dụng: /topnapthe [trang]"
    permission: napthe.command.topnapthe

permissions:
  napthe.command.napthe:
    default: true
    description: "Cho phép sử dụng lệnh /napthe"
  napthe.command.topnapthe:
    default: true
    description: "Cho phép sử dụng lệnh /topnapthe"
...
