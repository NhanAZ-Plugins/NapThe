---
name: NapThe
version: 1.0.0
main: NapThe\NapThe
src-namespace-prefix: NapThe
api: 5.0.0
author: NhanAZ
description: "Prepaid card donation plugin for PocketMine-MP using the TrumThe API"
website: https://github.com/NhanAZ/NapThe

commands:
  napthe:
    description: "Open the prepaid card form"
    usage: "Usage: /napthe"
    permission: napthe.command.napthe
  topnapthe:
    description: "View the donation leaderboard"
    usage: "Usage: /topnapthe [page]"
    permission: napthe.command.topnapthe

permissions:
  napthe.command.napthe:
    default: true
    description: "Allows use of /napthe"
  napthe.command.topnapthe:
    default: true
    description: "Allows use of /topnapthe"
...
