name: Analyze and build NapThe

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze source and verify PHAR
    runs-on: ubuntu-24.04
    steps:
      - name: Check out NapThe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out minimum Axolotl-PM API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: b16cc69974d4e805d21e6328ab77c0e17cd7116d # 5.0.0
          path: .devtools-dependencies/axolotl-pm-minimum
          persist-credentials: false

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955 # 5.49.1
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out Axolotl PHP setup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl PHP 8.2 environment
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.2"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node .devtools-dependencies/setup-php-action/dist/index.js

      - name: Lint plugin PHP source
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check provider URL override safety
        shell: bash
        run: |
          php <<'PHP'
          <?php
          require 'src/Constant.php';
          putenv('TRUMTHE_API_URL');
          if (\NapThe\Constant::apiUrl() !== \NapThe\Constant::URL) {
              throw new RuntimeException('Default endpoint changed');
          }
          putenv('TRUMTHE_API_URL=https://example.org/chargingws/v2');
          if (\NapThe\Constant::apiUrl() !== 'https://example.org/chargingws/v2') {
              throw new RuntimeException('HTTPS override was rejected');
          }
          foreach (['http://example.org/api', 'https://user@example.org/api', 'https://example.org/api#fragment'] as $url) {
              putenv('TRUMTHE_API_URL=' . $url);
              try {
                  \NapThe\Constant::apiUrl();
              } catch (InvalidArgumentException) {
                  continue;
              }
              throw new RuntimeException('Unsafe URL accepted');
          }
          PHP

      - name: Keep pending payments after throttled status checks
        run: php tests/status-rate-limit.php

      - name: Keep inconclusive payment statuses pending
        run: php tests/status-finality.php

      - name: Verify donation ledger restart and duplicate handling
        run: php tests/donation-ledger.php

      - name: Verify pending payment recovery after restart
        run: php tests/pending-payment-recovery.php

      - name: Analyze and build with pinned DevTools
        id: build
        uses: NhanAZ/DevTools@8d13a75aaf4f330fdbd93737d58be9cacc41e262 # v1.0.15
        with:
          project: .
          output: build
          phpstan: max
          phpstan-server: |
            .devtools-dependencies/axolotl-pm-minimum
            .devtools-dependencies/axolotl-pm

      - name: Verify PHAR contents and checksum
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          PHAR_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$PHAR_PATH" | cut -d ' ' -f 1)" = "$PHAR_SHA256"
          php -r '$p = new Phar(getenv("PHAR_PATH")); foreach (["plugin.yml", "src/NapThe.php", "src/utils/FormAPI/Form.php", "licenses/FormAPI-LGPL-3.0.txt"] as $f) { if (!$p->offsetExists($f)) { throw new RuntimeException("Missing PHAR entry: " . $f); } }'
